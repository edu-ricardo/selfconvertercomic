# Publica ghcr.io/edu-ricardo/quadrinhoteca:<versão> quando uma tag vX.Y.Z é criada.
# O Umbrel não compila imagens; o pacote no GHCR precisa estar público.
name: Imagem

on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ghcr.io/edu-ricardo/quadrinhoteca:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=QuadrinhoTeca: conversão PDF→CBZ e catálogo de quadrinhos
          cache-from: type=gha
          cache-to: type=gha,mode=max
