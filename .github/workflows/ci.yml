name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Backend
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils  # fallback do conversor
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...

      - name: Imagem Docker (sem publicar)
        run: docker build -t quadrinhoteca:ci .
